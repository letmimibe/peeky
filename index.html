<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Peeky is a tiny local-first reader for HTML, Markdown, and text files." />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Peeky — drop a file, have a peek.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Peeky home">
        <span class="brand-eye" aria-hidden="true">◉</span>
        <span>peeky</span>
      </a>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">☼</button>
        <a class="tiny-link" href="https://github.com/letmimibe/peeky" target="_blank" rel="noreferrer">github ↗</a>
      </div>
    </header>

    <main>
      <section id="landing" class="landing">
        <div class="landing-copy">
          <p class="eyebrow">local-first file reader</p>
          <h1>Drop a file.<br><em>Have a peek.</em></h1>
          <p class="lede">Open HTML, Markdown, and plain text right in your browser. Nothing gets uploaded anywhere.</p>
        </div>

        <label id="dropzone" class="dropzone" for="fileInput" tabindex="0">
          <input id="fileInput" type="file" accept=".html,.htm,.md,.markdown,.txt,.text" hidden />
          <div class="drop-eye" aria-hidden="true">
            <div class="eye-lid"><div class="pupil"></div></div>
          </div>
          <strong>Drop something here</strong>
          <span>or click to choose a file</span>
          <small>HTML · Markdown · TXT</small>
        </label>

        <div class="paste-wrap">
          <button id="pasteToggle" class="ghost-btn" type="button">Paste text instead</button>
          <div id="pastePanel" class="paste-panel" hidden>
            <textarea id="pasteInput" placeholder="Paste Markdown, HTML, or text…"></textarea>
            <div class="paste-actions">
              <select id="pasteType" aria-label="Content type">
                <option value="markdown">Markdown</option>
                <option value="html">HTML</option>
                <option value="text">Plain text</option>
              </select>
              <button id="openPaste" class="primary-btn" type="button">Open in Peeky</button>
            </div>
          </div>
        </div>
      </section>

      <section id="reader" class="reader" hidden>
        <aside class="sidebar">
          <div>
            <button id="newFileBtn" class="ghost-btn full" type="button">← Open another file</button>
            <div class="file-card">
              <div class="file-icon" id="fileIcon">MD</div>
              <div class="file-meta">
                <strong id="fileName">untitled.md</strong>
                <span id="fileDetails">Markdown</span>
              </div>
            </div>
          </div>
          <div id="tocWrap" class="toc-wrap" hidden>
            <p class="sidebar-label">On this page</p>
            <nav id="toc" class="toc"></nav>
          </div>
          <p class="privacy-note">Processed locally in your browser.</p>
        </aside>

        <section class="content-area">
          <div class="reader-toolbar">
            <div class="mode-switch" role="tablist" aria-label="Reader mode">
              <button id="previewTab" class="mode active" role="tab" aria-selected="true">Preview</button>
              <button id="sourceTab" class="mode" role="tab" aria-selected="false">Source</button>
            </div>
            <div class="reader-actions">
              <button id="searchBtn" class="icon-btn" type="button" title="Search">⌕</button>
              <button id="copyBtn" class="icon-btn" type="button" title="Copy source">⧉</button>
              <button id="printBtn" class="icon-btn" type="button" title="Print">↗</button>
            </div>
          </div>

          <div id="searchBar" class="search-bar" hidden>
            <input id="searchInput" type="search" placeholder="Search in document…" autocomplete="off" />
            <span id="searchCount">0 matches</span>
            <button id="closeSearch" class="icon-btn" type="button">×</button>
          </div>

          <div class="reading-progress" aria-hidden="true"><div id="progressBar"></div></div>

          <div id="previewPane" class="pane preview-pane"></div>
          <pre id="sourcePane" class="pane source-pane" hidden><code id="sourceCode"></code></pre>
        </section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
